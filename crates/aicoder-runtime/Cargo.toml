[package]
name = "aicoder-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
aicoder-core.workspace = true
aicoder-codemode = { path = "../aicoder-codemode", optional = true, features = ["engine"] }
aicoder-providers.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
dotenvy.workspace = true
libc = "0.2"
fs2 = "0.4"
ring = "0.17.14"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["fs", "io-util", "process", "signal", "time"] }
url = "2"
shlex = "2"
similar = { version = "3", default-features = false, features = ["std", "text"] }
regex = "1"
globset = "0.4"
ignore = "0.4"
yaml-rust2 = { version = "0.12", default-features = false }
tiktoken-rs = { version = "0.12.0", default-features = false, optional = true }

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"], optional = true }
base64 = { version = "0.22", optional = true }
reqwest = { version = "0.12", features = ["json", "stream"], optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", default-features = false, optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
package-downloads = ["dep:reqwest", "dep:flate2", "dep:tar", "dep:base64"]
code-mode = ["dep:aicoder-codemode", "dep:base64", "auxiliary-models"]
auxiliary-models = ["aicoder-providers/auxiliary-models"]
mcp-stdio = ["process-extensions", "dep:base64"]
mcp-fixtures = ["mcp-stdio", "process-extension-fixtures"]
process-extensions = []
process-extension-fixtures = ["process-extensions"]
images = ["dep:image", "dep:base64"]
tokenizer-tiktoken = ["dep:tiktoken-rs"]

[[example]]
name = "offline_images"
required-features = ["images"]

[[bin]]
name = "aicoder-process-fixture"
path = "tests/fixtures/process_server.rs"
required-features = ["process-extension-fixtures"]

[[example]]
name = "offline_process_extensions"
required-features = ["process-extensions"]

[[bin]]
name = "aicoder-mcp-fixture"
path = "tests/fixtures/mcp_server.rs"
required-features = ["mcp-fixtures"]

[[example]]
name = "offline_mcp"
required-features = ["mcp-stdio"]

[[example]]
name = "offline_code_mode"
required-features = ["code-mode"]
