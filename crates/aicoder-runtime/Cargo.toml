[package]
name = "aicoder-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
aicoder-core.workspace = true
aicoder-providers.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
dotenvy.workspace = true
libc = "0.2"
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["fs", "io-util", "process", "time"] }
url = "2"
shlex = "2"
similar = { version = "3", default-features = false, features = ["std", "text"] }
regex = "1"
globset = "0.4"
ignore = "0.4"
yaml-rust2 = { version = "0.12", default-features = false }

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
