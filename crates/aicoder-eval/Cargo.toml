[package]
name = "aicoder-eval"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "aicoder-swebench"
path = "src/bin/aicoder-swebench.rs"

[dependencies]
aicoder-core = { path = "../.." }
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["tracing-log"] }

[dev-dependencies]
async-trait = "0.1"
