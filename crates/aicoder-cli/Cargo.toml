[package]
name = "aicoder-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "aicoder"
path = "src/main.rs"

[dependencies]
aicoder-core = { path = "../.." }
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["tracing-log"] }
