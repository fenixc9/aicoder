name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: clippy,rustfmt
      - name: Install runtime tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Offline smoke
        run: cargo run --locked -p aicoder-core --example offline_smoke
      - name: In-memory model provider example
        run: cargo run --locked -p aicoder-core --example model_provider
      - name: Embedded agent example
        run: cargo run --locked -p aicoder-core --example embedded_agent
      - name: Controlled offline agent example
        run: cargo run --locked -p aicoder-core --example controlled_agent
      - name: Versioned event stream example
        run: cargo run --locked -p aicoder-core --example event_stream
      - name: Explicit subscription overflow example
        run: cargo run --locked -p aicoder-core --example event_stream -- --overflow
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

  event-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install development schema checker
        run: |
          python3 -m venv "$RUNNER_TEMP/aicoder-schema"
          "$RUNNER_TEMP/aicoder-schema/bin/python" -m pip install -r scripts/requirements-schema.txt
      - name: Validate published event fixture
        run: '"$RUNNER_TEMP/aicoder-schema/bin/python" scripts/check_event_schema.py'
