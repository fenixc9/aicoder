name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: clippy,rustfmt
      - name: Install runtime tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep bubblewrap util-linux mount ca-certificates
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test isolated core without workspace feature unification
        run: cargo test --locked -p aicoder-core --all-targets
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Offline coding benchmarks, archived failures and loopback adapter
        run: |
          cargo build --locked -p aicoder-eval --bin aicoder-bench
          python3 scripts/check_benchmark.py --output "$RUNNER_TEMP/aicoder-bench"
      - name: Preserve offline benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-coding-benchmark
          path: ${{ runner.temp }}/aicoder-bench
          if-no-files-found: ignore
      - name: Offline SWE-bench generation, resume and grading contracts
        run: |
          cargo build --locked -p aicoder-eval --bins --example offline_swebench
          python3 scripts/check_swebench.py --output "$RUNNER_TEMP/aicoder-swebench"
      - name: Preserve SWE-bench contract evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-swebench-contract
          path: ${{ runner.temp }}/aicoder-swebench
          if-no-files-found: ignore
      - name: Offline smoke
        run: cargo run --locked -p aicoder-runtime --example offline_smoke
      - name: In-memory model provider example
        run: cargo run --locked -p aicoder-core --example model_provider
      - name: Native extension registration and plan guard
        run: |
          cargo run --locked -p aicoder-core --example native_extensions
          cargo test --locked -p aicoder-runtime --no-default-features --test tool_interception
          cargo run --locked -p aicoder-runtime --example offline_tool_interception
          cargo run --locked -p aicoder-runtime --example offline_tool_interception -- --deny
          cargo run --locked -p aicoder-runtime --features code-mode --example offline_tool_interception -- --code-mode
          cargo run --locked -p aicoder-runtime --features code-mode --example offline_tool_interception -- --code-mode --deny
          cargo test --locked -p aicoder-runtime --no-default-features --test request_views
          cargo run --locked -p aicoder-runtime --example offline_request_views
          cargo run --locked -p aicoder-runtime --example offline_request_views -- --stream
          cargo test --locked -p aicoder-providers --test transport
          cargo test --locked -p aicoder-runtime --no-default-features --test transport_hooks
          cargo run --locked -p aicoder-runtime --example offline_transport_hooks
          cargo run --locked -p aicoder-runtime --example offline_transport_hooks -- --stream
          cargo test --locked -p aicoder-providers --all-features --test transport
          cargo test --locked -p aicoder-runtime --no-default-features --features auxiliary-models --test auxiliary_transport
          cargo run --locked -p aicoder-runtime --features auxiliary-models --example offline_auxiliary_transport
          cargo run --locked -p aicoder-runtime --features auxiliary-models --example offline_auxiliary_transport -- --observer-error
          cargo run --locked -p aicoder-runtime --features auxiliary-models --example offline_auxiliary_transport -- --deny
          cargo run --locked -p aicoder-runtime --features code-mode --example offline_auxiliary_transport -- --code-mode
          cargo run --locked -p aicoder-runtime --features code-mode --example offline_auxiliary_transport -- --code-mode --deny
      - name: Actionable round and settlement boundaries
        run: |
          cargo test --locked -p aicoder-runtime --no-default-features --test boundary_hooks
          cargo run --locked -p aicoder-runtime --example offline_boundary_hooks
          cargo run --locked -p aicoder-runtime --example offline_boundary_hooks -- --deny
          cargo run --locked -p aicoder-runtime --features code-mode --example offline_boundary_hooks -- --code-mode
          cargo run --locked -p aicoder-runtime --features code-mode --example offline_boundary_hooks -- --code-mode --deny
      - name: Once-per-run startup preparation
        run: |
          cargo test --locked -p aicoder-runtime --no-default-features --test startup_hooks
          cargo run --locked -p aicoder-runtime --example offline_startup_hooks
          cargo run --locked -p aicoder-runtime --example offline_startup_hooks -- --deny
          cargo run --locked -p aicoder-runtime --features code-mode --example offline_startup_hooks -- --code-mode
          cargo run --locked -p aicoder-runtime --features code-mode --example offline_startup_hooks -- --code-mode --deny
      - name: Raw input before expansion and ordered controls
        run: |
          cargo test --locked -p aicoder-runtime --no-default-features --test input_hooks
          cargo run --locked -p aicoder-runtime --example offline_input_hooks
          cargo run --locked -p aicoder-runtime --example offline_input_hooks -- --deny
          cargo run --locked -p aicoder-runtime --features code-mode --example offline_input_hooks -- --code-mode
          cargo run --locked -p aicoder-runtime --features code-mode --example offline_input_hooks -- --code-mode --deny
          cargo run --locked -p aicoder-runtime --example offline_input_hooks -- --handled
          cargo build --locked -p aicoder-tui --example offline_extension_ui
          python3 scripts/check_input_hooks.py
      - name: Sourced custom messages and idle triggers
        run: |
          cargo test --locked -p aicoder-runtime --no-default-features --test custom_messages
          cargo run --locked -p aicoder-runtime --example offline_custom_messages
          cargo run --locked -p aicoder-runtime --example offline_custom_messages -- --deny
          cargo run --locked -p aicoder-runtime --features code-mode --example offline_custom_messages -- --code-mode
          cargo run --locked -p aicoder-runtime --features code-mode --example offline_custom_messages -- --code-mode --deny
          cargo run --locked -p aicoder-runtime --example offline_custom_messages -- --record-only
          cargo build --locked -p aicoder-tui --example offline_extension_ui
          python3 scripts/check_custom_messages.py
      - name: Busy custom delivery and next-turn claims
        run: |
          cargo test --locked -p aicoder-runtime --no-default-features --test custom_delivery
          cargo run --locked -p aicoder-runtime --example offline_custom_delivery -- --delivery steer
          cargo run --locked -p aicoder-runtime --example offline_custom_delivery -- --delivery follow_up
          cargo run --locked -p aicoder-runtime --example offline_custom_delivery -- --delivery turn_end
          cargo run --locked -p aicoder-runtime --example offline_custom_delivery -- --delivery next_turn
          cargo run --locked -p aicoder-runtime --example offline_custom_delivery -- --deny
          cargo run --locked -p aicoder-runtime --features code-mode --example offline_custom_delivery -- --code-mode --delivery steer
          cargo run --locked -p aicoder-runtime --features code-mode --example offline_custom_delivery -- --code-mode --delivery follow_up
          cargo run --locked -p aicoder-runtime --features code-mode --example offline_custom_delivery -- --code-mode --delivery turn_end
          cargo run --locked -p aicoder-runtime --features code-mode --example offline_custom_delivery -- --code-mode --delivery next_turn
          cargo run --locked -p aicoder-runtime --features code-mode --example offline_custom_delivery -- --code-mode --deny
      - name: Planning, protected paths and read-only worker Agent extensions
        run: cargo run --locked -p aicoder-runtime --example coding_extensions
      - name: Versioned process tools and owned-plan approval
        run: |
          cargo build --locked -p aicoder-runtime --features process-extension-fixtures --bin aicoder-process-fixture
          cargo run --locked -p aicoder-runtime --features process-extensions --example offline_process_extensions
      - name: MCP modern/legacy stdio and shared-core example
        run: |
          cargo build --locked -p aicoder-runtime --features mcp-fixtures --bin aicoder-mcp-fixture
          cargo run --locked -p aicoder-runtime --features mcp-stdio --example offline_mcp
      - name: Optional bounded JavaScript over actual tools and cold JSONL state
        run: |
          cargo run --locked -p aicoder-runtime --features code-mode --example offline_code_mode
          cargo build --locked -p aicoder-cli --features code-mode
          python3 scripts/check_code_mode.py
      - name: Pinned resource packages and public session state
        run: cargo run --locked -p aicoder-runtime --example offline_packages
      - name: Embedded agent example
        run: cargo run --locked -p aicoder-core --example embedded_agent
      - name: Controlled offline agent example
        run: cargo run --locked -p aicoder-core --example controlled_agent
      - name: Versioned event stream example
        run: cargo run --locked -p aicoder-core --example event_stream
      - name: Explicit subscription overflow example
        run: cargo run --locked -p aicoder-core --example event_stream -- --overflow
      - name: Shared offline runtime example
        run: cargo run --locked -p aicoder-runtime --example offline_runtime
      - name: Offline project resources example
        run: cargo run --locked -p aicoder-runtime --example offline_resources
      - name: Bounded offline file tools example
        run: cargo run --locked -p aicoder-runtime --example offline_file_tools
      - name: Prepared edits and approval diffs example
        run: cargo run --locked -p aicoder-runtime --example offline_edits
      - name: Bounded shell and timeout recovery example
        run: cargo run --locked -p aicoder-runtime --example offline_shell
      - name: Scoped session approval example
        run: cargo run --locked -p aicoder-runtime --example offline_approvals
      - name: Branch context and canonical history example
        run: cargo run --locked -p aicoder-runtime --example offline_context
      - name: Durable semantic summary example
        run: cargo run --locked -p aicoder-runtime --example offline_summary
      - name: Recover full archived tool output
        run: cargo run --locked -p aicoder-runtime --example offline_artifacts
      - name: Branch navigation and validated model selection
        run: cargo run --locked -p aicoder-runtime --example offline_navigation
      - name: Context policy and default token counter
        run: cargo run --locked -p aicoder-runtime --example offline_context_policy
      - name: Optional local tokenizers
        run: |
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features
          cargo run --locked -p aicoder-runtime --features tokenizer-tiktoken --example offline_context_policy -- cl100k_base
      - name: Bounded archive continuation
        run: cargo run --locked -p aicoder-runtime --example offline_archive
      - name: Canonical exports and explicit local publication
        run: cargo run --locked -p aicoder-runtime --example offline_exports
      - name: Branch reasoning selection and codec-independent metadata
        run: cargo run --locked -p aicoder-runtime --example offline_reasoning
      - name: Real TUI reasoning controls and terminal-disconnect cleanup
        run: |
          cargo build --locked -p aicoder-tui
          python3 scripts/check_reasoning_tui.py
      - name: Real TUI composer, references, approvals and controls
        run: python3 scripts/check_tui_interaction.py
      - name: Bounded offline image input
        run: |
          cargo run --locked -p aicoder-runtime --features images --example offline_images
          cargo build --locked -p aicoder-cli -p aicoder-tui
          python3 scripts/check_images.py
      - name: Packaged palettes and native extension UI in a real terminal
        # Package palettes are data and work without enabling process transports.
        run: |
          python3 scripts/check_package_themes.py
          cargo build --locked -p aicoder-tui --example offline_extension_ui
          python3 scripts/check_extension_ui.py
      - name: Build optional Web and SDK parity entry
        run: cargo build --locked -p aicoder-cli -p aicoder-web --features server --bins --examples
      - name: SDK, CLI JSON, RPC and Web consistency
        run: python3 scripts/check_frontend_parity.py
      - name: Explicit stdio activation and cleanup in stock hosts
        run: |
          cargo build --locked -p aicoder-cli -p aicoder-tui -p aicoder-web -p aicoder-runtime --features server,host-extensions,mcp-fixtures,images --bins
          python3 scripts/check_host_extensions.py
          python3 scripts/check_host_extensions.py --packages
          python3 scripts/check_host_extensions.py --images
          python3 scripts/check_host_extensions.py --images --mime-alias
          python3 scripts/check_file_images.py
      - name: Explicit Code Mode images across stock hosts
        run: |
          cargo build --locked -p aicoder-cli -p aicoder-tui -p aicoder-web --features server,images,code-mode --bins
          python3 scripts/check_file_images.py --code-mode
          python3 scripts/check_file_images.py --only
          python3 scripts/check_file_images.py --classifier
          python3 scripts/check_file_images.py --generate-images
      - name: Optional Web documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked -p aicoder-web --features server --no-deps
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps
      - name: Bounded remote package CLI over local npm and actual Git HTTP
        run: |
          cargo build --locked -p aicoder-cli
          cp target/debug/aicoder "$RUNNER_TEMP/aicoder-without-downloads"
          cargo build --locked -p aicoder-cli --features package-downloads
          python3 scripts/check_package_downloads.py --disabled-binary "$RUNNER_TEMP/aicoder-without-downloads"
          python3 scripts/check_package_graph.py

  event-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install development schema checker
        run: |
          python3 -m venv "$RUNNER_TEMP/aicoder-schema"
          "$RUNNER_TEMP/aicoder-schema/bin/python" -m pip install -r scripts/requirements-schema.txt
      - name: Validate published event fixture
        run: '"$RUNNER_TEMP/aicoder-schema/bin/python" scripts/check_event_schema.py'
      - name: Validate published RPC fixture
        run: '"$RUNNER_TEMP/aicoder-schema/bin/python" scripts/check_rpc_schema.py'
      - name: Validate canonical export fixture
        run: '"$RUNNER_TEMP/aicoder-schema/bin/python" scripts/check_export_schema.py'
      - name: Validate published process-tool wire fixture
        run: '"$RUNNER_TEMP/aicoder-schema/bin/python" scripts/check_process_protocol.py'
