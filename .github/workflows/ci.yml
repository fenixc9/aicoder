name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: clippy,rustfmt
      - name: Install runtime tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test isolated core without workspace feature unification
        run: cargo test --locked -p aicoder-core --all-targets
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Offline smoke
        run: cargo run --locked -p aicoder-runtime --example offline_smoke
      - name: In-memory model provider example
        run: cargo run --locked -p aicoder-core --example model_provider
      - name: Embedded agent example
        run: cargo run --locked -p aicoder-core --example embedded_agent
      - name: Controlled offline agent example
        run: cargo run --locked -p aicoder-core --example controlled_agent
      - name: Versioned event stream example
        run: cargo run --locked -p aicoder-core --example event_stream
      - name: Explicit subscription overflow example
        run: cargo run --locked -p aicoder-core --example event_stream -- --overflow
      - name: Shared offline runtime example
        run: cargo run --locked -p aicoder-runtime --example offline_runtime
      - name: Offline project resources example
        run: cargo run --locked -p aicoder-runtime --example offline_resources
      - name: Bounded offline file tools example
        run: cargo run --locked -p aicoder-runtime --example offline_file_tools
      - name: Prepared edits and approval diffs example
        run: cargo run --locked -p aicoder-runtime --example offline_edits
      - name: Bounded shell and timeout recovery example
        run: cargo run --locked -p aicoder-runtime --example offline_shell
      - name: Scoped session approval example
        run: cargo run --locked -p aicoder-runtime --example offline_approvals
      - name: Branch context and canonical history example
        run: cargo run --locked -p aicoder-runtime --example offline_context
      - name: Durable semantic summary example
        run: cargo run --locked -p aicoder-runtime --example offline_summary
      - name: Recover full archived tool output
        run: cargo run --locked -p aicoder-runtime --example offline_artifacts
      - name: Branch navigation and validated model selection
        run: cargo run --locked -p aicoder-runtime --example offline_navigation
      - name: Context policy and default token counter
        run: cargo run --locked -p aicoder-runtime --example offline_context_policy
      - name: Optional local tokenizers
        run: |
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features
          cargo run --locked -p aicoder-runtime --features tokenizer-tiktoken --example offline_context_policy -- cl100k_base
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

  event-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install development schema checker
        run: |
          python3 -m venv "$RUNNER_TEMP/aicoder-schema"
          "$RUNNER_TEMP/aicoder-schema/bin/python" -m pip install -r scripts/requirements-schema.txt
      - name: Validate published event fixture
        run: '"$RUNNER_TEMP/aicoder-schema/bin/python" scripts/check_event_schema.py'
