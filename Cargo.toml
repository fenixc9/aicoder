[workspace]
members = ["crates/aicoder-core", "crates/aicoder-providers", "crates/aicoder-cli", "crates/aicoder-eval", "crates/aicoder-tui", "crates/aicoder-runtime", "crates/aicoder-web", "crates/aicoder-codemode"]
default-members = ["crates/aicoder-core", "crates/aicoder-providers", "crates/aicoder-cli", "crates/aicoder-eval", "crates/aicoder-tui", "crates/aicoder-runtime"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.dependencies]
aicoder-core = { path = "crates/aicoder-core" }
aicoder-providers = { path = "crates/aicoder-providers" }
aicoder-runtime = { path = "crates/aicoder-runtime" }
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
futures = "0.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["tracing-log"] }
