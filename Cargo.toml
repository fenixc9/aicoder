[package]
name = "aicoder-core"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/aicoder-cli"]
resolver = "3"

[dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }

# HTTP 客户端（用于调用 LLM API）
reqwest = { version = "0.12", features = ["json", "stream", "hickory-dns"] }

# JSON 序列化/反序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
httpdate = "1"

# 异常处理
anyhow = "1"

# 日志框架
tracing = "0.1"

# 异步工具集
futures = "0.3"
async-stream = "0.3"

# 异步工具和模型接口
async-trait = "0.1"

# UUID
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["tracing-log"] }
